<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/dashboard}"
>
  <head>
    <title>Permission Management</title>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-xl font-bold text-slate-900">Permissions</h1>
          <p class="text-sm text-slate-500 mt-1">
            Manage the individual permission codes assigned to roles.
          </p>
        </div>
        <a
          th:href="@{/admin/permissions/create}"
          class="rounded-lg bg-[#0a1e3f] px-5 py-2 text-sm font-semibold text-white hover:bg-[#112d5a] shadow-sm"
        >
          + Create Permission
        </a>
      </div>

      <div
        th:if="${error}"
        class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3"
        th:text="${error}"
      ></div>
      <div
        th:if="${success}"
        class="mb-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm px-4 py-3"
        th:text="${success}"
      ></div>

      <div
        th:each="group : ${groupedPermissions}"
        class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-4"
      >
        <div
          class="bg-[#0a1e3f] text-white text-xs font-bold px-6 py-2"
          th:text="${#strings.toUpperCase(group.moduleName)}"
        ></div>
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-left">
            <tr>
              <th class="px-6 py-2 font-bold text-slate-700 text-xs">Code</th>
              <th class="px-6 py-2 font-bold text-slate-700 text-xs">
                Used By
              </th>
              <th class="px-6 py-2 font-bold text-slate-700 text-xs text-right">
                Actions
              </th>
            </tr>
          </thead>
          <tbody>
            <tr
              th:each="p : ${group.permissions}"
              class="border-t border-slate-100"
            >
              <td
                class="px-6 py-3 font-mono text-slate-900"
                th:text="${p.code}"
              ></td>
              <td
                class="px-6 py-3 text-slate-600"
                th:text="${p.roleCount} + ' roles'"
              ></td>
              <td class="px-6 py-3 text-right space-x-2">
                <a
                  th:href="@{/admin/permissions/{id}/edit(id=${p.permissionId})}"
                  class="inline-block rounded-lg bg-[#0a1e3f] px-4 py-1.5 text-xs font-semibold text-white hover:bg-[#112d5a]"
                  >Edit</a
                >
                <button
                  type="button"
                  th:attr="onclick=|openDeleteModal('${p.permissionId}', '${p.code}', ${p.roleCount}, '@{/admin/permissions/{id}/delete(id=${p.permissionId})}')|"
                  class="text-red-600 hover:text-red-800"
                  title="Delete"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-4 w-4 inline"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path
                      d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"
                    ></path>
                  </svg>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div
        th:if="${#lists.isEmpty(groupedPermissions)}"
        class="bg-white rounded-xl border border-slate-200 shadow-sm p-8 text-center text-slate-400"
      >
        No permissions defined yet.
      </div>

      <!-- Same shared delete modal pattern as role-management.html -->
      <div
        id="deleteModalOverlay"
        class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50"
      >
        <div
          class="bg-white rounded-xl shadow-lg max-w-sm w-full mx-4 p-6 text-center"
        >
          <div
            id="deleteModalIconWrapper"
            class="mx-auto mb-4 h-14 w-14 rounded-full flex items-center justify-center"
          >
            <svg
              id="deleteModalIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="h-7 w-7"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            ></svg>
          </div>
          <h3
            id="deleteModalTitle"
            class="text-lg font-bold text-slate-900 mb-2"
          ></h3>
          <p id="deleteModalMessage" class="text-sm text-slate-500 mb-6"></p>
          <div id="deleteModalActions" class="flex gap-3 justify-center"></div>
        </div>
      </div>

      <script>
        document.addEventListener("DOMContentLoaded", function () {
          const overlay = document.getElementById("deleteModalOverlay");
          if (overlay && overlay.parentElement !== document.body) {
            document.body.appendChild(overlay);
          }
        });

        function openDeleteModal(id, code, roleCount, deleteUrl) {
          const iconWrapper = document.getElementById("deleteModalIconWrapper");
          const icon = document.getElementById("deleteModalIcon");
          const title = document.getElementById("deleteModalTitle");
          const message = document.getElementById("deleteModalMessage");
          const actions = document.getElementById("deleteModalActions");

          if (roleCount > 0) {
            iconWrapper.className =
              "mx-auto mb-4 h-14 w-14 rounded-full bg-amber-100 flex items-center justify-center";
            icon.className = "h-7 w-7 text-amber-500";
            icon.innerHTML =
              '<path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>';
            title.textContent = "Cannot Delete Permission";
            message.textContent = `"${code}" is currently used by ${roleCount} role(s). Remove it from those roles before deleting.`;
            actions.innerHTML = `<button type="button" onclick="closeDeleteModal()"
          class="w-full rounded-lg bg-[#0a1e3f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#112d5a]">Understood</button>`;
          } else {
            iconWrapper.className =
              "mx-auto mb-4 h-14 w-14 rounded-full bg-red-100 flex items-center justify-center";
            icon.className = "h-7 w-7 text-red-500";
            icon.innerHTML =
              '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"></path>';
            title.textContent = "Delete Permission";
            message.textContent = `Are you sure you want to delete "${code}"? This cannot be undone.`;
            actions.innerHTML = `
          <button type="button" onclick="closeDeleteModal()"
            class="w-full rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cancel</button>
          <button type="button" onclick="submitDelete('${deleteUrl}')"
            class="w-full rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-700">Delete</button>`;
          }
          document
            .getElementById("deleteModalOverlay")
            .classList.remove("hidden");
        }

        function closeDeleteModal() {
          document.getElementById("deleteModalOverlay").classList.add("hidden");
        }

        function submitDelete(deleteUrl) {
          const form = document.createElement("form");
          form.method = "post";
          form.action = deleteUrl;
          document.body.appendChild(form);
          form.submit();
        }

        document
          .getElementById("deleteModalOverlay")
          .addEventListener("click", function (e) {
            if (e.target === this) closeDeleteModal();
          });
      </script>
    </div>
  </body>
</html>
