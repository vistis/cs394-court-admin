<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/dashboard}"
>
  <head>
    <title>Role Management</title>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-xl font-bold text-slate-900">
            Role and Permissions Management
          </h1>
        </div>
        <a
          th:if="${#authorization.expression('hasAuthority(''ROLE_CREATE'')')}"
          th:href="@{/admin/roles/create}"
          class="rounded-lg bg-[#0a1e3f] px-5 py-2 text-sm font-semibold text-white hover:bg-[#112d5a] shadow-sm"
        >
          + Create New Role
        </a>
      </div>

      <div
        th:if="${error}"
        class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3"
        th:text="${error}"
      ></div>
      <div
        th:if="${success}"
        class="mb-4 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm px-4 py-3"
        th:text="${success}"
      ></div>

      <div
        class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden"
      >
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-left">
            <tr>
              <th class="px-6 py-3 font-bold text-slate-900">Group Name</th>
              <th class="px-6 py-3 font-bold text-slate-900">Users</th>
              <th class="px-6 py-3 font-bold text-slate-900">Permissions</th>
              <th class="px-6 py-3 font-bold text-slate-900 text-right">
                Actions
              </th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="role : ${roles}" class="border-t border-slate-100">
              <td class="px-6 py-4">
                <a
                  th:if="${#authorization.expression('hasAuthority(''ROLE_VIEW'')')}"
                  th:href="@{/admin/roles/{id}(id=${role.roleId})}"
                  class="font-semibold text-slate-900 hover:underline"
                >
                  <span th:text="${role.name}"></span>
                </a>
              </td>
              <td
                class="px-6 py-4 text-slate-600"
                th:text="${role.userCount} + ' Users'"
              ></td>
              <td
                class="px-6 py-4 text-slate-600"
                th:text="${role.permissionCount} + ' Permissions'"
              ></td>
              <td class="px-6 py-4 text-right space-x-2">
                <a
                  th:if="${#authorization.expression('hasAuthority(''ROLE_UPDATE'')')}"
                  th:href="@{/admin/roles/{id}/edit(id=${role.roleId})}"
                  class="inline-block rounded-lg bg-[#0a1e3f] px-4 py-1.5 text-xs font-semibold text-white hover:bg-[#112d5a]"
                  >Update</a
                >
                <button
                  type="button"
                  th:if="${#authorization.expression('hasAuthority(''ROLE_DELETE'')')}"
                  th:attr="onclick=|openDeleteModal('${role.roleId}', '${role.name}', ${role.userCount}, '@{/admin/roles/{id}/delete(id=${role.roleId})}')|"
                  class="text-white bg-red-600 rounded-lg px-4 py-1.5 text-xs front-semibold hover:bg-red-800"
                  title="Delete"
                >
                  Delete
                </button>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(roles)}">
              <td colspan="4" class="px-6 py-8 text-center text-slate-400">
                No roles configured yet.
              </td>
            </tr>
          </tbody>
        </table>

        <!-- <div
          class="flex items-center justify-between px-6 py-4 border-t border-slate-100"
          th:if="${totalPages > 1}"
        >
          <a
            th:if="${hasPrevious}"
            th:href="@{/admin/roles(page=${prevPage})}"
            class="text-sm text-slate-600 hover:underline"
            >&larr; Previous</a
          >
          <span th:unless="${hasPrevious}"></span>
          <span
            class="text-sm text-slate-500"
            th:text="'Page ' + ${currentPage} + ' of ' + ${totalPages}"
          ></span>
          <a
            th:if="${hasNext}"
            th:href="@{/admin/roles(page=${nextPage})}"
            class="text-sm text-slate-600 hover:underline"
            >Next &rarr;</a
          >
          <span th:unless="${hasNext}"></span>
        </div> -->
      </div>

      <!-- Shared delete modal — content swapped by JS depending on user count -->
      <div
        id="deleteModalOverlay"
        class="hidden fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50"
      >
        <div
          class="bg-white rounded-xl shadow-lg max-w-sm w-full mx-4 p-6 text-center"
        >
          <div
            id="deleteModalIconWrapper"
            class="mx-auto mb-4 h-14 w-14 rounded-full flex items-center justify-center"
          >
            <svg
              id="deleteModalIcon"
              xmlns="http://www.w3.org/2000/svg"
              class="h-7 w-7"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <!-- swapped via JS: warning triangle for blocked, question mark for confirm -->
            </svg>
          </div>

          <h3
            id="deleteModalTitle"
            class="text-lg font-bold text-slate-900 mb-2"
          ></h3>
          <p id="deleteModalMessage" class="text-sm text-slate-500 mb-6"></p>

          <div id="deleteModalActions" class="flex gap-3 justify-center">
            <!-- buttons injected via JS depending on state -->
          </div>
        </div>
      </div>

      <script th:inline="javascript">
        function openDeleteModal(roleId, roleName, userCount, deleteUrl) {
          const overlay = document.getElementById("deleteModalOverlay");
          const iconWrapper = document.getElementById("deleteModalIconWrapper");
          const icon = document.getElementById("deleteModalIcon");
          const title = document.getElementById("deleteModalTitle");
          const message = document.getElementById("deleteModalMessage");
          const actions = document.getElementById("deleteModalActions");

          if (userCount > 0) {
            // Blocked state — matches the "Cannot Delete Role" mockup
            iconWrapper.className =
              "mx-auto mb-4 h-14 w-14 rounded-full bg-amber-100 flex items-center justify-center";
            icon.className = "h-7 w-7 text-amber-500";
            icon.innerHTML =
              '<path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>';
            title.textContent = "Cannot Delete Role";
            message.textContent = `This role cannot be deleted because there are ${userCount} users currently assigned to it. Please reassign or remove these users before attempting to delete the role.`;
            actions.innerHTML = `
        <button type="button" onclick="closeDeleteModal()"
          class="w-full rounded-lg bg-[#0a1e3f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#112d5a]">
          Okay
        </button>`;
          } else {
            // Safe to delete — confirmation state
            iconWrapper.className =
              "mx-auto mb-4 h-14 w-14 rounded-full bg-red-100 flex items-center justify-center";
            icon.className = "h-7 w-7 text-red-500";
            icon.innerHTML =
              '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h0a2 2 0 0 1 2 2v2"></path>';
            title.textContent = "Delete Role";
            message.textContent = `Are you sure you want to delete "${roleName}"? This action cannot be undone.`;
            actions.innerHTML = `
        <button type="button" onclick="closeDeleteModal()"
          class="w-full rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">
          Cancel
        </button>
        <form method="post" th:action="@{/admin/roles}" id="deleteForm" class="w-full">
        </form>
        <button type="button" onclick="submitDelete('${deleteUrl}')"
          class="w-full rounded-lg bg-red-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-red-700">
          Delete
        </button>`;
          }

          overlay.classList.remove("hidden");
        }

        function closeDeleteModal() {
          document.getElementById("deleteModalOverlay").classList.add("hidden");
        }

        function submitDelete(deleteUrl) {
          const form = document.createElement("form");
          form.method = "post";
          form.action = deleteUrl;
          document.body.appendChild(form);
          form.submit();
        }

        // Close on backdrop click
        document
          .getElementById("deleteModalOverlay")
          .addEventListener("click", function (e) {
            if (e.target === this) closeDeleteModal();
          });
      </script>
    </div>
  </body>
</html>
