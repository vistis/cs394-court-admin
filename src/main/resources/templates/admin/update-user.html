<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/dashboard}"
>
  <head>
    <title>Update User</title>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-4">
          <a
            th:href="@{/admin/users}"
            class="h-10 w-10 border border-slate-200 bg-white rounded-lg flex items-center justify-center text-slate-600 hover:bg-slate-50 transition-colors shadow-sm"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
          </a>
          <div>
            <h1 class="text-xl font-bold text-slate-900">Update User</h1>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <a
            th:href="@{/admin/users}"
            class="rounded-lg border border-slate-300 bg-white px-5 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors shadow-sm"
          >
            Cancel
          </a>
          <button
            type="submit"
            form="updateUserForm"
            class="rounded-lg bg-[#0a1e3f] px-5 py-2 text-sm font-semibold text-white hover:bg-[#112d5a] transition-colors shadow-sm"
          >
            Save User
          </button>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
        <form
          id="updateUserForm"
          th:action="@{/admin/users/update/{userId}(userId=${user.userId})}"
          method="post"
          enctype="multipart/form-data"
          class="space-y-6"
        >
          <div
            class="bg-slate-50/50 rounded-xl border border-slate-200/60 p-5 flex items-center gap-5"
          >
            <!-- Left Square Wrapper -->
            <div
              class="relative h-24 w-24 bg-[#e8f0fe] rounded-lg border border-dashed border-slate-300 flex items-center justify-center text-slate-400 overflow-hidden"
            >
              <!-- This container will hold either the default icon or your live preview image -->
              <div
                id="image-container"
                class="h-full w-full flex items-center justify-center"
              >
                <!-- Default SVG Icon shown initially -->
                <img
                  th:if="${user.profilePicturePath != null}"
                  th:src="${user.profilePicturePath}"
                  alt="profile Picture"
                />
                <svg
                  th:unless="${user.profilePicturePath != null}"
                  id="default-avatar-icon"
                  xmlns="http://w3.org"
                  class="h-8 w-8 text-slate-500"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="8.5" cy="7" r="4"></circle>
                  <line x1="20" y1="8" x2="20" y2="14"></line>
                  <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
              </div>

              <!-- Small Edit Circular Badge -->
              <button
                type="button"
                onclick="document.getElementById('profileImage').click()"
                class="absolute -bottom-1 -right-1 h-6 w-6 bg-[#0a1e3f] text-white rounded-full flex items-center justify-center border border-white shadow-sm hover:bg-[#112d5a]"
              >
                <svg
                  xmlns="http://w3.org"
                  class="h-3.5 w-3.5"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
                  ></path>
                  <path
                    d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"
                  ></path>
                </svg>
              </button>
            </div>

            <!-- Right Side Form Controls -->
            <div>
              <h3 class="text-sm font-bold text-slate-900">Profile Picture</h3>
              <p class="text-xs text-slate-500 mt-1 mb-3">
                Recommended: Square JPEG or PNG, max 5MB
              </p>

              <!-- Hidden Native File Input (Triggers instant client-side rendering via onchange) -->
              <input
                type="file"
                id="profileImage"
                name="profileImage"
                accept="image/jpeg, image/png"
                class="hidden"
                onchange="previewProfilePicture(this)"
              />

              <!-- Visual Button for users to click -->
              <button
                type="button"
                onclick="document.getElementById('profileImage').click()"
                class="rounded-lg border border-slate-300 bg-white px-4 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50 shadow-sm"
              >
                Choose File
              </button>
              <span
                id="file-name-text"
                class="text-xs text-slate-400 ml-2 block mt-1 italic"
                >No file chosen</span
              >
            </div>
          </div>

          <!-- JavaScript to intercept the chosen image file and inject it directly into the DOM -->
          <script>
            function previewProfilePicture(input) {
              const textSpan = document.getElementById("file-name-text");
              const container = document.getElementById("image-container");

              // Make sure a file was actually picked
              if (input.files && input.files[0]) {
                const file = input.files[0];

                // 1. Update the filename label display text below the button
                textSpan.textContent = file.name;
                textSpan.className =
                  "text-xs text-emerald-600 font-medium block mt-1";

                // 2. Read the local binary data from the computer memory
                const reader = new FileReader();

                reader.onload = function (e) {
                  // Swap out the default SVG icon for an interactive dynamic image tag instantly
                  container.innerHTML = `<img src="${e.target.result}" alt="Profile Preview" class="h-full w-full object-cover" />`;
                };

                // Read file and parse it into an inline temporary base64 DataURL structure
                reader.readAsDataURL(file);
              }
            }
          </script>

          <hr class="border-slate-200" />

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-bold text-slate-900 mb-2"
                >Username <span class="text-red-500">*</span></label
              >
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-4 w-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path>
                  </svg>
                </span>
                <input
                  type="text"
                  name="username"
                  required
                  placeholder="e.g. j.dupont"
                  th:value="${user.username}"
                  class="w-full rounded-lg border border-slate-300 bg-white pl-10 pr-3 py-2.5 text-sm shadow-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-bold text-slate-900 mb-2"
                >Email Address <span class="text-red-500">*</span></label
              >
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-4 w-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                    ></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                  </svg>
                </span>
                <input
                  type="email"
                  name="email"
                  required
                  placeholder="staff@lexguard.gov"
                  th:value="${user.email}"
                  class="w-full rounded-lg border border-slate-300 bg-white pl-10 pr-3 py-2.5 text-sm shadow-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
                />
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-bold text-slate-900 mb-2"
                >First Name <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                name="firstName"
                required
                placeholder="Jonh"
                th:value="${user.firstName}"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm shadow-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
              />
            </div>
            <div>
              <label class="block text-sm font-bold text-slate-900 mb-2"
                >Last Name <span class="text-red-500">*</span></label
              >
              <input
                type="text"
                name="lastName"
                required
                placeholder="David"
                th:value="${user.lastName}"
                class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm shadow-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-bold text-slate-900 mb-2"
                >Password <span class="text-red-500">*</span></label
              >
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-4 w-4"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"
                    ></path>
                  </svg>
                </span>
                <input
                  type="password"
                  name="password"
                  placeholder="e.g. 12333cchddkkdikk"
                  class="w-full rounded-lg border border-slate-300 bg-white pl-10 pr-3 py-2.5 text-sm shadow-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
                />
              </div>
            </div>
          </div>

          <div class="flex items-center gap-3 py-2">
            <label class="relative inline-flex items-center cursor-pointer">
              <input
                type="checkbox"
                name="active"
                th:checked="${user.isActive}"
                class="sr-only peer"
              />
              <div
                class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"
              ></div>
            </label>
            <span class="text-sm font-bold text-slate-900">Active</span>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-900 mb-2"
              >Administrative Role <span class="text-red-500">*</span></label
            >
            <div class="relative">
              <span
                class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                  <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                </svg>
              </span>
              <select
                name="roles"
                required
                class="w-full rounded-lg border border-slate-300 bg-white pl-10 pr-10 py-2.5 text-sm shadow-sm appearance-none focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
              >
                <option value="" disabled th:selected="${currentRole == null}">
                  Select a role...
                </option>
                <option
                  th:each="availableRole : ${availableRoles}"
                  th:value="${availableRole.name}"
                  th:text="${availableRole.name}"
                  th:selected="${availableRole.name == currentRole}"
                >
                  Role Option
                </option>
                <option
                  value="Greffier"
                  th:if="${#lists.isEmpty(availableRoles)}"
                >
                  Greffier
                </option>
                <option value="Admin" th:if="${#lists.isEmpty(availableRoles)}">
                  Admin
                </option>
              </select>
              <span
                class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-500"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-4 w-4"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </span>
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
