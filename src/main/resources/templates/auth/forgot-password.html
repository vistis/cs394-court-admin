<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/auth}"
>
  <head>
    <title>Forgot Password</title>
  </head>
  <body>
    <div
      layout:fragment="content"
      class="min-h-screen w-full flex items-center justify-center bg-[#0a1e3f] py-12"
    >
      <div
        class="bg-white rounded-xl border border-slate-200 shadow-sm p-8 w-full max-w-md"
      >
        <h1 class="text-xl font-bold text-slate-900 mb-2">
          Reset Your Password
        </h1>
        <p class="text-sm text-slate-500 mb-6">
          Enter your username and email to continue.
        </p>

        <div
          th:if="${error}"
          class="mb-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3"
          th:text="${error}"
        ></div>

        <form
          th:action="@{/forgot-password}"
          th:object="${identity}"
          method="post"
          class="space-y-4"
        >
          <div>
            <label class="block text-sm font-bold text-slate-900 mb-1"
              >Username</label
            >
            <input
              type="text"
              name="username"
              th:value="${identity?.username}"
              required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
            />
            <p
              th:if="${#fields.hasErrors('username')}"
              th:errors="*{username}"
              class="text-red-600 text-xs mt-1"
            ></p>
          </div>
          <div>
            <label class="block text-sm font-bold text-slate-900 mb-1"
              >Email</label
            >
            <input
              type="email"
              name="email"
              th:value="${identity?.email}"
              required
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
            />
            <p
              th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"
              class="text-red-600 text-xs mt-1"
            ></p>
          </div>
          <button
            type="submit"
            class="w-full rounded-lg bg-[#0a1e3f] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#112d5a]"
          >
            Continue
          </button>
          <a
            th:href="@{/login}"
            class="block text-center text-sm text-slate-500 hover:underline"
            >Back to login</a
          >
        </form>
      </div>
    </div>
  </body>
</html>
