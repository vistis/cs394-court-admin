<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/auth}"
>
  <head>
    <title>Login</title>
  </head>
  <body>
    <div
      layout:fragment="content"
      class="min-h-screen w-full flex items-center justify-center bg-[#0a1e3f] py-12"
    >
      <div class="w-full max-w-sm rounded-xl overflow-hidden shadow-2xl">
        <!-- Header bar -->
        <div class="bg-slate-300 py-6 px-8">
          <h2 class="text-2xl font-bold text-center text-[#0a1e3f]">
            Welcome Back
          </h2>
        </div>

        <!-- Form card -->
        <div class="bg-white px-8 py-8">
          <div th:if="${param.error}" class="rounded-md bg-red-50 p-4 mb-4">
            <p
              class="text-sm text-red-800"
              th:text="${param.error[0] == 'not_admin'} ? 'Your account does not have administrator access.' : 'Invalid email or password.'"
            ></p>
          </div>

          <div th:if="${param.logout}" class="rounded-md bg-green-50 p-4 mb-4">
            <p class="text-sm text-green-800">You have been logged out.</p>
          </div>

          <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
              <label
                for="email"
                class="block text-sm font-semibold text-gray-800 mb-1"
                >Username or Email</label
              >
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                  </svg>
                </span>
                <input
                  type="text"
                  id="username"
                  name="username"
                  required
                  autofocus
                  placeholder="admin@lexguard.gov/admin.court"
                  class="w-full rounded-md border border-gray-300 pl-10 pr-3 py-2.5 shadow-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
                />
              </div>
            </div>

            <div>
              <label
                for="password"
                class="block text-sm font-semibold text-gray-800 mb-1"
                >Password</label
              >
              <div class="relative">
                <span
                  class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="11" width="18" height="11" rx="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                  </svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  required
                  class="w-full rounded-md border border-gray-300 pl-10 pr-10 py-2.5 shadow-sm focus:border-[#0a1e3f] focus:outline-none focus:ring-1 focus:ring-[#0a1e3f]"
                />
                <button
                  type="button"
                  onclick="togglePassword()"
                  class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600"
                >
                  <svg
                    id="eyeIcon"
                    xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <button
              type="submit"
              class="w-full flex items-center justify-center gap-2 rounded-md bg-[#1e3a5f] px-4 py-3 text-base font-semibold text-white shadow-sm hover:bg-[#254a75] focus:outline-none focus:ring-2 focus:ring-[#1e3a5f] focus:ring-offset-2 transition-colors"
            >
              Sign In
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
              </svg>
            </button>
          </form>
        </div>
      </div>

      <script>
        function togglePassword() {
          const input = document.getElementById("password");
          input.type = input.type === "password" ? "text" : "password";
        }
      </script>
    </div>
  </body>
</html>
