<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layouts/dashboard}"
>
  <head>
    <title>Access Denied</title>
  </head>
  <body>
    <div layout:fragment="content">
      <div class="flex flex-col items-center justify-center py-24 text-center">
        <div
          class="h-16 w-16 rounded-full bg-red-100 flex items-center justify-center mb-4"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8 text-red-500"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
          </svg>
        </div>
        <h1 class="text-xl font-bold text-slate-900 mb-2">Access Denied</h1>
        <p class="text-sm text-slate-500 max-w-sm">
          You don't have permission to view this page. If you believe this is a
          mistake, contact your system administrator.
        </p>
      </div>
    </div>
  </body>
</html>
